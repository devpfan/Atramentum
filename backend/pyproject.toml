[tool.poetry]
name = "atramentum-api"
version = "0.1.0"
description = "Backend API for Atramentum (AI-powered IDE for Writers)"
authors = ["devpfan <pfabian@outlook.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = {extras = ["email"], version = "^2.13.4"}
pydantic-settings = "^2.2.0"
sqlalchemy = "^2.0.28"
psycopg2-binary = "^2.9.9"
pgvector = "^0.2.5"
alembic = "^1.13.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = "^2.13.0"
python-multipart = "^0.0.32"
google-genai = "^2.14.0"
bcrypt = "^5.0.0"
litellm = "^1.94.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
